<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Voice Enabled</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 24px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            text-align: center;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        header p {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        #status-bar {
            padding: 8px 24px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            font-size: 12px;
            color: #888;
        }

        #status-bar.active {
            background: #1e3a5f;
            color: #60a5fa;
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .msg.user {
            align-self: flex-end;
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg.ai {
            align-self: flex-start;
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-bottom-left-radius: 4px;
        }

        .msg.error {
            align-self: center;
            background: #3b1111;
            border: 1px solid #611;
            color: #f87171;
            font-size: 13px;
        }

        .typing {
            align-self: flex-start;
            color: #888;
            font-size: 13px;
            padding: 8px 14px;
        }

        #input-area {
            padding: 16px 24px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #message-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #0f0f0f;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }

        #message-input:focus { border-color: #2563eb; }

        #mic-btn {
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #1e1e1e;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 20px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        #mic-btn:hover {
            background: #2a2a2a;
        }

        #mic-btn.listening {
            background: #dc2626;
            color: #fff;
            animation: pulse 1.5s infinite;
        }

        #mic-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        #send-btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            background: #2563eb;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toggle {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .toggle input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <h1>AI Assistant</h1>
        <p>Chat with voice support</p>
    </header>

    <div id="status-bar">Status: Ready</div>

    <div id="chat-box"></div>

    <div id="input-area">
        <button id="mic-btn" title="Click to speak">🎤</button>
        <input id="message-input" type="text" placeholder="Type or click mic to speak..." autocomplete="off" />
        <button id="send-btn">Send</button>
        <div class="toggle">
            <input type="checkbox" id="voice-toggle" checked />
            <label for="voice-toggle">Voice</label>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const input = document.getElementById("message-input");
        const sendBtn = document.getElementById("send-btn");
        const micBtn = document.getElementById("mic-btn");
        const statusBar = document.getElementById("status-bar");
        const voiceToggle = document.getElementById("voice-toggle");

        const SESSION_ID = crypto.randomUUID();

        function setStatus(text, active = false) {
            statusBar.textContent = text;
            statusBar.className = active ? "active" : "";
        }

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = `msg ${type}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function showTyping() {
            const div = document.createElement("div");
            div.className = "typing";
            div.id = "typing-indicator";
            div.textContent = "AI is thinking...";
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById("typing-indicator");
            if (el) el.remove();
        }

        // ========== TEXT-TO-SPEECH ==========
        const synth = window.speechSynthesis;
        let selectedVoice = null;
        let isSpeaking = false;

        function loadVoices() {
            const voices = synth.getVoices();
            selectedVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google'))) ||
                           voices.find(v => v.lang.startsWith('en-US')) ||
                           voices.find(v => v.lang.startsWith('en')) ||
                           voices[0];
            console.log('Voice loaded:', selectedVoice?.name);
        }

        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = loadVoices;
        }
        loadVoices();

        function speak(text) {
            if (!voiceToggle.checked) return;

            // Stop any ongoing speech
            synth.cancel();

            // Small delay to ensure cancel completes
            setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);
                if (selectedVoice) utterance.voice = selectedVoice;
                utterance.rate = 0.85;  // Slower for elderly
                utterance.pitch = 1.0;
                utterance.volume = 1.0;

                utterance.onstart = () => {
                    isSpeaking = true;
                    setStatus("🔊 Speaking...", true);
                };

                utterance.onend = () => {
                    isSpeaking = false;
                    setStatus("Ready");
                };

                utterance.onerror = (e) => {
                    console.error('Speech error:', e);
                    isSpeaking = false;
                    setStatus("Voice error: " + e.error);
                };

                synth.speak(utterance);
            }, 100);
        }

        // ========== SPEECH RECOGNITION ==========
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                setStatus("🎤 Listening... Speak now!", true);
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove('listening');
                if (statusBar.textContent.includes('Listening')) {
                    setStatus("Ready");
                }
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                input.value = transcript;
                setStatus("Heard: " + transcript);
                setTimeout(() => sendMessage(), 500);
            };

            recognition.onerror = (event) => {
                console.error('Recognition error:', event.error);
                isListening = false;
                micBtn.classList.remove('listening');

                if (event.error === 'no-speech') {
                    setStatus("No speech detected. Try again.");
                } else if (event.error === 'audio-capture') {
                    setStatus("Microphone blocked. Check browser permissions.");
                    addMessage("Please allow microphone access in your browser settings", "error");
                } else if (event.error !== 'aborted') {
                    setStatus("Mic error: " + event.error);
                }
            };

            micBtn.addEventListener("click", () => {
                if (isListening) {
                    recognition.stop();
                } else {
                    // Stop any speech first
                    synth.cancel();
                    try {
                        recognition.start();
                    } catch (e) {
                        console.error('Failed to start:', e);
                        setStatus("Error: " + e.message);
                    }
                }
            });
        } else {
            micBtn.disabled = true;
            micBtn.title = "Speech not supported";
            setStatus("Voice input not supported in this browser");
        }

        // ========== CHAT ==========
        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, "user");
            input.value = "";
            sendBtn.disabled = true;
            micBtn.disabled = true;
            showTyping();

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, session_id: SESSION_ID }),
                });

                hideTyping();

                if (!res.ok) {
                    const err = await res.json();
                    addMessage(`Error: ${err.detail}`, "error");
                    setStatus("Error");
                    return;
                }

                const data = await res.json();
                addMessage(data.reply, "ai");
                setStatus("Got response");

                // Speak the response
                speak(data.reply);

            } catch (e) {
                hideTyping();
                addMessage(`Connection error: ${e.message}`, "error");
                setStatus("Connection failed");
            } finally {
                sendBtn.disabled = false;
                if (recognition) micBtn.disabled = false;
                input.focus();
            }
        }

        sendBtn.addEventListener("click", sendMessage);
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        input.focus();
        setStatus("Ready - Type or click 🎤 to speak");
    </script>
</body>
</html>
